name: Comparator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
          tool-cache: false
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          build: 'false'
          use-mathlib-cache: 'true'
          test: 'false'
          lint: 'false'
      - name: Put the toolchain kernels on PATH
        run: |
          set -euo pipefail
          toolchain_bin=$(dirname "$(elan which lean)")
          test -x "$toolchain_bin/nanoda_bin"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Install the pinned Palomar Bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config apparmor
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/checkers"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/downloads/install_bwrap.sh" \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarSubmission/14aa8d6b3c2f14a8540605e37144560b9a00e7e7/scripts/install_bwrap.sh
          printf '%s  %s\n' c290df6cebdf1cb26edb69ed4164d9551062bfeb65243b93d1d1d3b77eac0a35 \
            "$RUNNER_TEMP/downloads/install_bwrap.sh" | sha256sum --check --quiet
          comparator_bwrap=$(bash "$RUNNER_TEMP/downloads/install_bwrap.sh" "$RUNNER_TEMP/checkers/bwrap")
          echo "COMPARATOR_BWRAP=$comparator_bwrap" >> "$GITHUB_ENV"
          "$comparator_bwrap" --unshare-all --new-session --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - name: Build and audit the proved library
        run: |
          set -o pipefail
          lake build BGWLeaves Solution 2>&1 | tee "$RUNNER_TEMP/proved-build.log"
          if grep -n "declaration uses 'sorry'" "$RUNNER_TEMP/proved-build.log"; then exit 1; fi
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee "$RUNNER_TEMP/axiom-audit.log"
      - name: Compare the seven statements with NanoDa
        run: |
          set -o pipefail
          lake comparator --config comparator.json 2>&1 | tee "$RUNNER_TEMP/comparator.log"
      - name: Preserve diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comparator-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proved-build.log
            ${{ runner.temp }}/axiom-audit.log
            ${{ runner.temp }}/comparator.log
          if-no-files-found: warn
