name: Lean build and axiom audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: false
          large-packages: false
          swap-storage: false
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          build: 'true'
          use-mathlib-cache: 'true'
          test: 'false'
          lint: 'false'
      - name: Check that no declaration uses sorry
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -n "declaration uses 'sorry'" build.log; then exit 1; fi
      - name: Check transitive axioms of the project and vendored modules
        run: lake env lean scripts/AxiomAudit.lean
