# Metadata of the formalization, schema v0.4 (as in the Palomar template of 28 October 2026).
version: v0.4
project:
  name: Invariance principles for Galton–Watson trees conditioned on the number of leaves
  description: >-
    Lean 4 and Mathlib formalization of the scalar local limit theorem with
    corrected stable norming (Theorem 1.10), the admissible leaf counts and
    their probability asymptotics (Theorem 3.1, Introduction (I)), maximum
    degree concentration under the paper's hypothesis H (Theorem 7.1(ii)),
    and corrected probability asymptotics for the number of vertices with
    degree in an arbitrary set (Theorem 8.1(I)). Seven declarations are
    selected for comparison. The repository also contains the functional
    invariance principles, which are outside this submission's scope.
  authors:
    - Igor Kortchemski
  license: Apache-2.0
  responsible_maintainers:
    - Igor Kortchemski
classification:
  arxiv: [math.PR]
  msc2020: [60J80, 60F17, 05C05]
sources:
  - title: Invariance principles for Galton–Watson trees conditioned on the number of leaves
    authors: [Igor Kortchemski]
    id: arXiv:1110.2163v4
    type: paper
    location: https://arxiv.org/abs/1110.2163v4
    relationship: formalizes
    note: >-
      Published as Stochastic Process. Appl. 122 (2012) 3126–3172,
      doi:10.1016/j.spa.2012.05.013, with the same numbering of results. The
      paper is not covered by the code license.
    license: unknown
    author_endorsement: participated
related_formalizations:
  - id: https://github.com/igor-kortchemski/Bienayme-Galton-Watson-Trees
    relationship: adapts
    note: >-
      Bienaymé–Galton–Watson trees, with source slices of Rémy Degenne's
      brownian-motion and kolmogorov_extension4 projects. The modules used here
      are vendored in Vendor/bgw (Apache-2.0).
status:
  scope: >-
    This submission selects Theorem 1.10(i–iii) with corrected norming,
    Theorem 3.1(i–ii) including lattice cases, Theorem 7.1(ii), and corrected
    Theorem 8.1(I). The last is proved for arbitrary degree sets of positive
    offspring mass, without the printed finite-or-cofinite restriction or
    aperiodicity assumption. The exact seven declarations are listed in
    comparator.json and restated in Challenge.lean with concrete definitions.
    Its seven deliberate theorem placeholders are excluded from sorry_count;
    no definition is left unspecified. The full development and its broader
    coverage record remain in the repository; functional convergence and
    Gromov–Hausdorff–Prokhorov claims are outside the comparison and submission.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [claude-opus-5-5, claude-sonnet-5-5, gpt-6.1-sol, gpt-6-luna, gpt-6-astra, moonshotai/kimi-k3.1-pro, deepseek-v4.1-flash]
      framework: Claude Code coordinator with Codex, Open Math OS and Claude Code workers; Codex submission preparation
      tool_setup: >-
        Lean 4.35.0 and Mathlib v4.35.0, the lean-autoformalization skills,
        statements frozen after independent audits before proof work, and
        independent agent audits of the sealed proofs and of the coverage.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: not tracked
      prompting_notes: >-
        Formalize every numbered result of the paper, preserving hypotheses,
        quantifiers and boundary cases; formalize the corrected statement when
        a printed one is false, and record the correction.
  spend_usd: not tracked
  notes: >-
    The code and documentation were generated by AI agents. Agent audits are
    not human peer review, and no human has reviewed the proofs line by line.
fidelity:
  divergences: >-
    Theorem 1.10 uses (−Γ(1−θ))^(1/θ) for θ < 2 and includes the factor 1/2
    under the square root for θ = 2 with infinite variance. Theorem 8.1(I)
    replaces the printed gcd(b−1,d) by the gcd of degrees in supp μ ∩ A and
    of k−1 for degrees outside A, and is strengthened as stated in status.scope.
    The printed false versions are not claimed proved. Theorem 3.1(ii)
    follows the walk indexed by leaves, including the lattice case omitted
    from the printed proof. See FORMALIZATION_REPORT.md for the full record.
review:
  status: agent-audited; proofs kernel-checked, not human-reviewed
  reviewers: [Claude Sonnet 5.5, Claude Opus 5.5, GPT-6.1 Sol and GPT-6 Astra audit agents]
  notes: >-
    The new Challenge has not received an independent statement review.
    Local exact comparison, Lean and NanoDa replays, and the 6,705-declaration
    transitive axiom audit passed on 13 November 2026; evidence is recorded
    in verification/README.md. Exact-commit official Linux Comparator and
    full Palomar mechanical reports are provided by the corresponding
    GitHub Actions runs. These checks do not imply Palomar registration.
alignment:
  namespace: BGWLeaves
  statements:
    - source: Introduction (I), Theorem 3.1
      lean: BGWLeaves.thm_ltn_i, BGWLeaves.thm_ltn_ii
      module: BGWLeaves.LeafMass
      status: proved
    - source: Theorem 1.10
      lean: BGWLeaves.StableAnalysis.locallimit_i, BGWLeaves.StableAnalysis.locallimit_ii, BGWLeaves.StableAnalysis.locallimit_iii
      module: BGWLeaves.StableAnalysis, BGWLeaves.StableAnalysis.Consequences
      status: proved in corrected form
      note: The constant is (−Γ(1−θ))^{1/θ} for θ < 2, and a factor 1/2 is added under the square root for θ = 2 with infinite variance.
    - source: Theorem 7.1(ii)
      lean: BGWLeaves.thm_max_ii
      module: BGWLeaves.MaxDegree
      status: proved
      note: Under HypH, along leaf counts with positive probability; bounded and unbounded support are both included.
    - source: Theorem 8.1 (I)
      lean: BGWLeaves.thm81_corrected_general
      module: BGWLeaves.GeneralAInf
      status: proved in corrected form
      note: The factor gcd(b−1, d) is replaced by the gcd of the degrees in supp μ ∩ A and of k−1 for k ∈ supp μ ∖ A, along n ≡ 1 modulo it.
acknowledgements: >-
  Lean, Mathlib, the Bienaymé–Galton–Watson trees formalization, and Rémy
  Degenne's brownian-motion and kolmogorov_extension4 projects, whose notices
  are preserved under Vendor/bgw.
