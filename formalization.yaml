# Metadata of the formalization, schema v0.4 (as in the Palomar template of 28 October 2026).
version: v0.4
project:
  name: Invariance principles for Galton–Watson trees conditioned on the number of leaves
  description: >-
    Lean 4 and Mathlib formalization of every numbered result of the paper:
    the asymptotics of the probability that a critical Galton–Watson tree has
    n leaves, the joint convergence of the rescaled Łukasiewicz path, contour
    and height function of a tree conditioned to have n leaves to the excursion
    of a stable Lévy process and its height process, the maximum degree, and
    the extension to vertices with degree in a given set. Theorems 1.10 and
    8.1(I) are formalized in corrected form.
  authors:
    - Igor Kortchemski
  license: Apache-2.0
  responsible_maintainers:
    - Igor Kortchemski
classification:
  arxiv: [math.PR]
  msc2020: [60J80, 60F17, 05C05]
sources:
  - title: Invariance principles for Galton–Watson trees conditioned on the number of leaves
    authors: [Igor Kortchemski]
    id: arXiv:1110.2163v4
    type: paper
    location: https://arxiv.org/abs/1110.2163v4
    relationship: formalizes
    note: >-
      Published as Stochastic Process. Appl. 122 (2012) 3126–3172,
      doi:10.1016/j.spa.2012.05.013, with the same numbering of results. The
      paper is not covered by the code license.
    license: unknown
    author_endorsement: participated
related_formalizations:
  - id: https://github.com/igor-kortchemski/Bienayme-Galton-Watson-Trees
    relationship: adapts
    note: >-
      Bienaymé–Galton–Watson trees, with source slices of Rémy Degenne's
      brownian-motion and kolmogorov_extension4 projects. The modules used here
      are vendored in Vendor/bgw (Apache-2.0).
status:
  scope: >-
    Every numbered theorem, proposition, lemma, corollary and remark with
    mathematical content, and the claims of the Introduction, are proved,
    except the claims that the contour and height functions determine the
    tree. Theorems 1.10 (norming constants) and 8.1(I) (arithmetic factor) are
    proved in corrected form; Theorem 5.1, Proposition 5.3, Lemma 5.7 and
    Remark 7.3 in a precise form of an ill-posed printed display. Lemma 5.8,
    Theorems 5.9, 6.1, 7.1(i) and the GH(P) claims carry the paper's Section 5
    assumption that supp μ ∖ {0} is non-lattice; Introduction (II) and
    Theorem 8.1(II) are also proved without it.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [claude-opus-5-5, claude-sonnet-5-5, gpt-6.1-sol, gpt-6-luna, gpt-6-astra, moonshotai/kimi-k3.1-pro, deepseek-v4.1-flash]
      framework: Claude Code coordinator with Codex, Open Math OS and Claude Code workers
      tool_setup: >-
        Lean 4.35.0 and Mathlib v4.35.0, the lean-autoformalization skills,
        statements frozen after independent audits before proof work, and
        independent agent audits of the sealed proofs and of the coverage.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: not tracked
      prompting_notes: >-
        Formalize every numbered result of the paper, preserving hypotheses,
        quantifiers and boundary cases; formalize the corrected statement when
        a printed one is false, and record the correction.
  spend_usd: not tracked
  notes: >-
    The code and documentation were generated by AI agents. Agent audits are
    not human peer review, and no human has reviewed the proofs line by line.
fidelity:
  divergences: >-
    See status.scope for the corrected and restricted statements. The
    functional limit theorems hold for any norming sequence of the step law.
    Some proofs take different routes from the paper (FORMALIZATION_REPORT.md,
    "Differences of route"): Proposition 1.6 through a weighted cyclic lemma,
    Theorem 3.1(ii) through the walk indexed by leaves (with the lattice case
    the paper omits), and the convergence on [0,1] in Theorems 5.9 and 6.1
    through an oscillation control at the end point.
review:
  status: agent-audited; proofs kernel-checked, not human-reviewed
  reviewers: [Claude Sonnet 5.5, Claude Opus 5.5, GPT-6.1 Sol and GPT-6 Astra audit agents]
  notes: >-
    No Comparator check has been run; see verification/README.md.
alignment:
  namespace: BGWLeaves
  statements:
    - source: Introduction (I), Theorem 3.1
      lean: BGWLeaves.thm_ltn_i, BGWLeaves.thm_ltn_ii
      module: BGWLeaves.LeafMass
      status: proved
    - source: Introduction (II)
      lean: BGWLeaves.intro_II_general, BGWLeaves.intro_II
      module: BGWLeaves.LeafLimitsGeneral, BGWLeaves.LeafLimits
      status: proved
    - source: Theorem 1.10
      lean: BGWLeaves.StableAnalysis.locallimit_i, BGWLeaves.StableAnalysis.locallimit_ii, BGWLeaves.StableAnalysis.locallimit_iii
      module: BGWLeaves.StableAnalysis, BGWLeaves.StableAnalysis.Consequences
      status: proved in corrected form
      note: The constant is (−Γ(1−θ))^{1/θ} for θ < 2, and a factor 1/2 is added under the square root for θ = 2 with infinite variance.
    - source: Theorem 4.5
      lean: BGWLeaves.thm_inv1
      module: BGWLeaves.LeafLimits
      status: proved
    - source: Theorem 5.9
      lean: BGWLeaves.thm_cvG_i, BGWLeaves.thm_cvG_ii
      module: BGWLeaves.LeafLimits
      status: proved
      note: Under the Section 5 assumption that supp μ ∖ {0} is non-lattice.
    - source: Theorem 6.1
      lean: BGWLeaves.thm_cvW3
      module: BGWLeaves.LeafLimits
      status: proved
      note: Under the Section 5 assumption that supp μ ∖ {0} is non-lattice.
    - source: Theorem 7.1
      lean: BGWLeaves.thm_max_i, BGWLeaves.thm_max_ii
      module: BGWLeaves.MaxDegreeLimit, BGWLeaves.MaxDegree
      status: proved
    - source: Theorem 8.1 (I)
      lean: BGWLeaves.thm81_corrected_general
      module: BGWLeaves.GeneralAInf
      status: proved in corrected form
      note: The factor gcd(b−1, d) is replaced by the gcd of the degrees in supp μ ∩ A and of k−1 for k ∈ supp μ ∖ A, along n ≡ 1 modulo it.
    - source: Theorem 8.1 (II)
      lean: BGWLeaves.thm_general_II
      module: BGWLeaves.GeneralAFunctional
      status: proved
