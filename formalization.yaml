# Metadata of the formalization, schema v0.4 (as in the Palomar template of 28 October 2026).
version: v0.4
project:
  name: Invariance principles for Galton–Watson trees conditioned on the number of leaves
  description: >-
    Lean 4 and Mathlib formalization of the scalar local limit theorem with
    corrected stable norming (Theorem 1.10), the admissible leaf counts and
    their probability asymptotics (Theorem 3.1, Introduction (I)), maximum
    degree concentration under the paper's hypothesis H (Theorem 7.1(ii)),
    and corrected probability asymptotics for the number of vertices with
    degree in an arbitrary set (Theorem 8.1(I)). The principal functional
    results are the joint convergence of the rescaled Lukasiewicz path,
    contour and height under leaf conditioning (Introduction (II), including
    lattice laws) and under offspring-mark conditioning (Theorem 8.1(II)).
    Nine principal declarations and their explicit construction lemmas are
    selected for comparison. Tree laws, codings and limit laws are concrete;
    evaluation and J1 metric instances are fixed by checked characterizations.
  authors:
    - Igor Kortchemski
  license: Apache-2.0
  responsible_maintainers:
    - Igor Kortchemski
