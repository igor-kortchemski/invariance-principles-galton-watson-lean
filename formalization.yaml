status:
  scope: >-
    This submission selects Theorem 1.10(i–iii) with corrected norming,
    Theorem 3.1(i–ii) including lattice cases, Theorem 7.1(ii), and corrected
    Theorem 8.1(I). The last is proved for arbitrary degree sets of positive
    offspring mass, without the printed finite-or-cofinite restriction or
    aperiodicity assumption. It also selects Introduction (II) in its lattice
    generality and Theorem 8.1(II): joint walk, contour and height convergence
    to the coupled normalized stable excursion and height, with any
    admissible norming and along every admissible sequence tending to infinity.
    Theorem 8.1(II) retains the finite-or-cofinite restriction on marks in
    infinite variance. The nine principal results and their supporting
    construction lemmas are listed in comparator.json and restated in
    Challenge.lean. Deliberate Challenge placeholders are excluded from
    sorry_count: theorem proofs and two typeclass instances supplied by
    Solution. The instances are characterized by coe_mk (evaluation is the
    underlying path) and dist_eq_j1Dist (the metric has the explicit J1
    distance); these conditions determine their values. No tree law, coding,
    stable law, excursion law or height law is left unspecified. Other functional
    statements and the Gromov–Hausdorff–Prokhorov claims remain outside this
    comparison and submission. The broader coverage record is in the repository.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
